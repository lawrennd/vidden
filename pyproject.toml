[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidden"
version = "0.1.0"
description = "Latent-space visualisation, independent of the inference library."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Neil D. Lawrence", email = "lawrennd@gmail.com" }]
keywords = ["visualization", "latent-variable-models", "gplvm"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy",
]

[project.optional-dependencies]
explore = ["holoviews", "panel", "bokeh"]
gpy = ["gpy>=1.13", "pods"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.urls]
Homepage = "https://github.com/lawrennd/vidden"
Repository = "https://github.com/lawrennd/vidden"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["vidden"]
branch = true

[tool.coverage.report]
omit = ["*/tests/*"]
